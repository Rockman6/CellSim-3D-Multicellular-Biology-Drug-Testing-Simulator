<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CellSim Dish Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%232463eb%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23fff%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <strong>CellSim</strong> <span class="muted">dish viewer</span>
    </div>
    <div class="loaders">
      <label class="button" for="file">Open .jsonl</label>
      <input id="file" type="file" accept=".jsonl,.json,.gz" hidden>
      <select id="demo" aria-label="Demo runs">
        <option value="">Demo runs…</option>
      </select>
    </div>
  </header>

  <main id="main">
    <section id="stage-wrap" aria-label="Cells">
      <div id="stage"></div>
      <div id="drop" class="drop">Drop a <code>cellsim</code> stream (.jsonl or .jsonl.gz) here, or pick a demo run.</div>
      <div id="legend" class="legend" hidden></div>
      <div id="inspect" class="inspect" hidden></div>
    </section>

    <aside id="panel">
      <div id="meta" class="meta muted">No run loaded.</div>

      <div class="controls">
        <div class="row">
          <button id="play" class="button" disabled>Play</button>
          <input id="time" type="range" min="0" max="0" value="0" step="1" disabled aria-label="Time">
          <span id="tlabel" class="mono">t = –</span>
        </div>
        <div class="row">
          <label for="color">Colour by</label>
          <select id="color" disabled>
            <option value="phase">cycle phase</option>
            <option value="p53">p53</option>
            <option value="caspase3">caspase-3</option>
            <option value="damage">DNA damage</option>
            <option value="o2_mmHg">oxygen (mmHg)</option>
            <option value="growth_signal">growth signal</option>
            <option value="lineage">lineage (clone)</option>
          </select>
          <label class="check"><input id="slice" type="checkbox" disabled> cut open</label>
        </div>
      </div>

      <figure class="chart"><figcaption>Cells over time</figcaption><svg id="chart-counts"></svg></figure>
      <figure class="chart"><figcaption>Cycle phases (live cells)</figcaption><svg id="chart-phase"></svg></figure>
      <figure class="chart" id="fig-third"><figcaption id="third-caption">Size</figcaption><svg id="chart-third"></svg></figure>
      <figure class="chart" id="fig-profile" hidden><figcaption>Oxygen and drug, centre → medium</figcaption><svg id="chart-profile"></svg></figure>

      <div class="row">
        <button id="csv" class="button" disabled>Download time series (CSV)</button>
      </div>
      <p class="fine muted">Streams are written by <code>cellsim dish</code> (schema <code>cellsim.dish.stream/v1</code>) or
        <code>cellsim cell-stream</code> (<code>cellsim.cell.stream/v1</code>). The viewer renders them and runs no biology.</p>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="stream.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>

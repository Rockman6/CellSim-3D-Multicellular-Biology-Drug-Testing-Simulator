name: fep-freesolv

# Layer 1.3 Milestone A accuracy gate — does NOT run on every PR.
# Triggered manually via 'gh workflow run fep-freesolv.yml' once
# a rented GPU runner is available. Production parameters
# (≥ 50 ps equilibration + ≥ 100 ps production per window × 11
# windows × 2 legs × 12 compounds) take ~20 GPU-hours on an H100.
#
# Exit criterion: MAE ≤ 1.5 kcal/mol vs FreeSolv experimental.
# Pinned in src/fep/freesolv_validate.py — the workflow just
# wraps a deterministic cellsim fep-freesolv call and uploads
# the result CSV as an artifact.
#
# Why workflow_dispatch: running a GPU-hours FEP job on every PR
# would cost >$1k/month at current budgets and buy nothing —
# the scaffold / sampling / end-to-end pipeline is already
# smoke-gated on the PR CI (fast-tier). This is the quarterly
# honest-numbers run that goes into the professor update.

on:
  workflow_dispatch:
    inputs:
      n_windows:
        description: "alchemical λ-windows per leg"
        required: false
        default: "11"
      production_steps:
        description: "Langevin steps per window (25000 = 50 ps @ 2 fs)"
        required: false
        default: "25000"
      equilibration_steps:
        description: "equilibration steps per window"
        required: false
        default: "2500"

jobs:
  fep-freesolv:
    name: FEP FreeSolv 12 (Milestone A gate)
    runs-on: ubuntu-latest
    # TODO: switch to a GPU runner label (e.g. [self-hosted, gpu])
    # once the user provisions one. CPU fallback is here only so
    # the workflow file parses and can be triggered for dry-runs.
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up miniforge + cellsim env
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: cellsim
          miniforge-version: latest
          use-mamba: true

      - name: Env report
        run: |
          python -c "import openmm, openmmtools, openff.toolkit, pymbar; \
            print('openmm', openmm.__version__); \
            print('openmmtools', openmmtools.__version__); \
            print('openff-toolkit', openff.toolkit.__version__); \
            print('pymbar', pymbar.__version__)"

      - name: Run FreeSolv gate
        run: |
          mkdir -p run/fep
          python -u -m src.fep.freesolv_validate \
            benchmarks/fep/freesolv_12.yaml \
            --n-windows ${{ github.event.inputs.n_windows }} \
            --production-steps ${{ github.event.inputs.production_steps }} \
            --equilibration-steps ${{ github.event.inputs.equilibration_steps }} \
            --out-csv run/fep/freesolv_results.csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fep-freesolv-results
          path: run/fep/freesolv_results.csv
          retention-days: 90

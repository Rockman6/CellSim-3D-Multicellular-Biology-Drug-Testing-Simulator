# Publish the dish viewer, with freshly simulated demo runs, to GitHub Pages.
#
# The demo streams are NOT in the repository: they are outputs, and the
# spheroid ones are megabytes. This workflow runs the simulations, gzips
# the streams and uploads the result, so the hosted demo always shows
# what the current code actually produces.
#
# MANUAL UNTIL PAGES IS ENABLED. The repository owner has to turn it on
# once — Settings -> Pages -> Build and deployment -> Source: GitHub
# Actions — and until that happens the deploy step fails with "Pages is
# not enabled". Running on every push to main would therefore paint the
# default branch red for a setting, not a defect, so this workflow is
# dispatch-only. Once Pages is on, uncomment the `push:` block below and
# the site will rebuild whenever the viewer or the engine changes.
name: viewer

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "web/**"
  #     - "cellsim/cell/**"
  #     - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The cell simulator needs only NumPy and SciPy, so the demo runs do
      # not need the conda stack. If that stops being true, this fails.
      - name: install the cell simulator from pip alone
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import cellsim.cell.dish, cellsim.cell.engine; print('ok')"

      - name: simulate the demo runs
        run: bash web/demo/make_demos.sh web/demo

      - name: check the viewer can read every demo
        run: |
          for f in web/demo/*.jsonl.gz; do
            node tests/web/viewer_stream_check.js "$f"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Publish the dish viewer, with freshly simulated demo runs, to GitHub Pages.
#
# The demo streams are NOT in the repository: they are outputs, and the
# spheroid ones are megabytes. This workflow runs the simulations, gzips
# the streams and uploads the result, so the hosted demo always shows
# what the current code actually produces.
#
# Pages was enabled on the repository on 2026-10-06, so this now runs on
# its own: the site rebuilds whenever the viewer or the engine changes,
# and the demo runs are simulated at deploy time rather than committed,
# so what is published is always what the current code produces.
name: viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cellsim/cell/**"
      - "cellsim/*.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The cell simulator needs only NumPy and SciPy, so the demo runs do
      # not need the conda stack. If that stops being true, this fails.
      - name: install the cell simulator from pip alone
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -c "import cellsim.cell.dish, cellsim.cell.engine; print('ok')"

      - name: simulate the demo runs
        run: bash web/demo/make_demos.sh web/demo

      - name: check the viewer can read every demo
        run: |
          for f in web/demo/*.jsonl.gz; do
            node tests/web/viewer_stream_check.js "$f"
          done

      # The Lab runs the engine in the visitor's browser. It installs this
      # wheel, built from the commit being deployed, rather than whatever
      # is on PyPI — so the browser runs exactly the code on main, the
      # same principle as simulating the demos at deploy time. Installing
      # from PyPI instead would have shipped v1.4.0, from before every
      # engine fix made in October 2026.
      - name: build the wheel the Lab installs in the browser
        run: |
          pip install build
          python -m build --wheel --outdir web/lab/wheel .
          # The wheel keeps its real name, because micropip parses the
          # version out of it and "latest" is not one. The page reads this
          # pointer to learn which file to install.
          cd web/lab/wheel && ls cellsim-*-py3-none-any.whl | head -1 > LATEST
          echo "Lab will install: $(cat LATEST)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# CellSim Campaign-1 Python environment
#
# Usage:
#   mamba env create -f environment.yml    # or conda
#   conda activate cellsim
#
# Pinned to known-good versions as of the restart. Bump via PR only.
# Every tool below is BUY (integrate) rather than BUILD per the plan.

name: cellsim
channels:
  - conda-forge
  - omnia
dependencies:
  - python=3.11
  - pip

  # Cheminformatics
  - rdkit>=2024.03.1
  - openff-toolkit>=0.16
  - openff-forcefields>=2024
  - openff-interchange>=0.3
  - ambertools>=23            # for AM1-BCC, antechamber

  # MD engines
  - openmm>=8.1
  - openmm-ml                 # MACE / OrbNet plugin
  - openmmtools>=0.23
  - pdbfixer>=1.9
  - mdanalysis>=2.6

  # Quantum
  - xtb-python>=22.1
  - pyscf>=2.5

  # Coarse-grained
  - vermouth                  # martinize2

  # Docking + FEP
  # GNINA + perses installed via pip / source; placeholder here.

  # UQ + stats
  - mapie>=0.8
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.3

  # Storage
  - h5py>=3.10
  - pyarrow>=14
  - sqlite>=3.44

  # Pipeline
  - snakemake>=8
  - pyyaml
  - jinja2

  # Dev
  - pytest>=7
  - ruff
  - mypy
  - pre-commit

  - pip:
    - perses                  # alchemical FEP
    - mace-torch              # MACE ML-potential
    - posebusters             # pose validity

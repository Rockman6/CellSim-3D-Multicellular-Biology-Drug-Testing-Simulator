# CellSim Campaign-1 Python environment (non-AI)
#
# Usage:
#   mamba env create -f environment.yml    # or conda
#   conda activate cellsim
#
# Pinned to known-good versions as of the restart. Bump via PR only.
# Every tool below is BUY (integrate) rather than BUILD per the plan.
#
# Per the 2026-04-20 non-AI amendment (see MISSION.md), ML potentials
# (mace-torch, openmm-ml, NequIP, OrbNet, Allegro) and GNINA CNN-
# scored docking as the primary path are explicitly excluded. UQ
# comes from parameter sweeps + Sobol (SALib) + Monte-Carlo and
# MAPIE conformal as a post-hoc non-parametric wrapper.

name: cellsim
channels:
  - conda-forge
  - bioconda
  - omnia
dependencies:
  - python=3.11
  - pip

  # Cheminformatics
  - rdkit>=2024.03.1
  - openff-toolkit>=0.16
  - openff-forcefields>=2024
  - openff-interchange>=0.3
  - ambertools>=23            # for AM1-BCC, antechamber

  # MD engines (no ML potentials)
  - openmm>=8.1
  - openmmtools>=0.23
  - pdbfixer>=1.9
  - mdanalysis>=2.6

  # Quantum
  - xtb-python>=22.1
  - pyscf>=2.5

  # Coarse-grained
  - vermouth                  # martinize2

  # Docking + FEP (non-AI path)
  - vina>=1.2.5               # AutoDock Vina — primary docking engine
  - meeko>=0.7                # PDBQT prep for Vina (ligand + receptor)
  - fpocket>=4.2              # geometric binding-pocket detection
                              # (classical Voronoi/alpha-sphere; non-AI)

  # Metabolism (Campaign 2 prep)
  - cobra>=0.29               # COBRApy FBA
  - python-libsbml>=5.20      # SBML I/O for pathway models

  # UQ + stats (non-AI)
  - salib>=1.4                # Sobol, Morris, FAST sensitivity
                              # (conda-forge pkg is "salib"; Python
                              # import name is "SALib")
  - mapie>=0.8                # post-hoc conformal prediction wrapper
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - scikit-learn>=1.3         # calibration helpers (no neural use)

  # Storage
  - h5py>=3.10
  - pyarrow>=14
  - sqlite>=3.44

  # Pipeline
  - snakemake>=8
  - pyyaml
  - jinja2

  # Dev
  - pytest>=7
  - ruff
  - mypy
  - pre-commit

  - pip:
    - perses                  # alchemical FEP
    - posebusters             # pose validity
